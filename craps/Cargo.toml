[package]
name = "craps"
version = "0.1.0"
edition = "2024"
license = "0bsd"

[lib]
name = "craps"
crate-type = ["staticlib", "rlib"]

[features]
default = []

interpose-memcpy = []
lto = ["dice-rs/lto"]

log-fatal = ["dice-rs/log-fatal"]
log-info  = ["dice-rs/log-info"]
log-debug = ["dice-rs/log-debug"]

san-thread = ["dice-rs/san-thread"]
san-address = ["dice-rs/san-address"]
san-undefined = ["dice-rs/san-undefined"]

# Dice modules
dice = ["dice-rs/dice"]
dice-box = ["dice-rs/dice-box"]
dice-cxa = ["dice-rs/dice-cxa"]
dice-epoll = ["dice-rs/dice-epoll"]
dice-eventfd = ["dice-rs/dice-eventfd"]
dice-dirent = ["dice-rs/dice-dirent"]
dice-fcntl = ["dice-rs/dice-fcntl"]
dice-mman = ["dice-rs/dice-mman"]
dice-poll = ["dice-rs/dice-poll"]
dice-pthread_cond = ["dice-rs/dice-pthread_cond"]
dice-pthread_create = ["dice-rs/dice-pthread_create"]
dice-pthread_detach = ["dice-rs/dice-pthread_detach"]
dice-pthread_key = ["dice-rs/dice-pthread_key"]
dice-pthread_mutex = ["dice-rs/dice-pthread_mutex"]
dice-pthread_once = ["dice-rs/dice-pthread_once"]
dice-pthread_rwlock = ["dice-rs/dice-pthread_rwlock"]
dice-self = ["dice-rs/dice-self"]
dice-sem = ["dice-rs/dice-sem"]
dice-stacktrace = ["dice-rs/dice-stacktrace"]
dice-syscall = ["dice-rs/dice-syscall"]
dice-tsan = ["dice-rs/dice-tsan"]
dice-socket = ["dice-rs/dice-socket"]
dice-time = ["dice-rs/dice-time"]
dice-uio = ["dice-rs/dice-uio"]
dice-unistd = ["dice-rs/dice-unistd"]

# serialization

serde-json = [
    "felt/serde-json",
    "dep:serde",
]

abomonation = [
    "felt/abomonation",
    "dep:abomonation",
    "dep:abomonation_derive",
]

[dependencies]
dice-rs = { workspace = true }
felt = { workspace = true }
ctor = { workspace = true }
lazy_static = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, optional = true }
abomonation = { workspace = true, optional = true }
abomonation_derive = { workspace = true, optional = true }
