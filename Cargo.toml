[workspace]
resolver="3"
members = ["craps"]

[workspace.dependencies]
dice-rs = { path = "dice-rs/dice-rs", version = "0.1" }
ctor = "0.6.1"
log = "0.4.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2.177"
typetag = "0.2"

# Dependencies of the locally maintained event record/replay crates.
felt = { path = "felt" }
lazy_static = "1.5"
abomonation = "0.7"
abomonation_derive = "0.5"
