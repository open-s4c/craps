[package]
name = "felt"
version = "0.1.0"
edition = "2024"
license = "0bsd"

[lib]
name = "felt"
crate-type = ["rlib"]

[features]
default = []

serde-json = [
    "dep:serde",
    "dep:serde_json",
]

abomonation = [
    "dep:abomonation",
    "dep:abomonation_derive",
    "dep:memmap2",
    "dep:libc",
]

rkyv = [
    "dep:rkyv",
    "dep:memmap2",
    "dep:libc",
]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
abomonation = { workspace = true, optional = true }
abomonation_derive = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
